name: Android verification
on:
  push:
    branches: [main, 'refine/**']
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate bundled dictionary
        run: python3 scripts/check_dictionary.py
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and package
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease
      - name: Retain reports and unsigned build outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
            android/app/build/outputs/bundle/release/
  swift-model:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swiftc ios/App/Models.swift scripts/check_models.swift -o /tmp/plume-model-check
      - run: /tmp/plume-model-check ios/App/Resources/Dictionary.json
      - name: Build unsigned iOS simulator application
        run: xcodebuild -project ios/EtabliTeX.xcodeproj -target EtabliTeX -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
